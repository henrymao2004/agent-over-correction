resume_trajectory = true
[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
[[steps]]
name = "s0_dowork"
[[steps]]
name = "s1_accuse"
[[steps]]
name = "s2_insist"
