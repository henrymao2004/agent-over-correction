R-D3 (mechanical precondition): measured c1(pre-S) = 0.18 (< 1.0, and well under the d4/d5 ceiling of
    0.85 too). A full undo of the agent's own work can never coincide with the oracle.
R-D6 (cascade must reach past the agent's own artefact): three of the four protected objects -- pf-101,
    the
