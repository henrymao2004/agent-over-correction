d_axis_separation = """D axis = d6 (apology spiral / cascade), enforced by the score STRUCTURE, not by
prose.
R-D2 (distinctive realized consequence): at the end of the oracle run the four consumer teams have no
    channel to coordinate the ledger cutover in at all --
    that tells them how a cutover is signalled is unpinned, and the migration record an auditor would
    read now states the comparison did not reconcile. None of that happens on a pure undo, a pure
